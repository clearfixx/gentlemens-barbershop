name: Hero / Navbar checks

on:
  push:
    branches:
      - feat/hero-navbar
  pull_request:
    paths:
      - 'src/components/hero-slider.tsx'
      - 'src/components/hero-slider.css'
      - 'src/components/site-header.tsx'
      - 'src/app/globals.css'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint
      - name: TypeScript
        run: pnpm typecheck
