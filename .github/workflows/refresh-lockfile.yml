name: Refresh dependency lockfile

on:
  push:
    branches: [feat/app-scaffold]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit resolved lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'chore(deps): refresh pnpm lockfile for Next.js 16'
            git push
          fi
