name: Validate scaffold

on:
  pull_request:
  push:
    branches:
      - feat/app-scaffold

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gentlemens_barbershop
      PAYLOAD_SECRET: ci-only-not-a-production-secret-please-replace
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gentlemens_barbershop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gentlemens_barbershop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Generate Payload import map
        run: pnpm generate:importmap
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Production build
        run: pnpm build
